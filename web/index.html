<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Drive</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-drive" viewBox="0 0 24 24">
        <path d="M6.5 18.5h11a3.5 3.5 0 0 0 .53-6.96A5.5 5.5 0 0 0 7.2 9.6 4.45 4.45 0 0 0 6.5 18.5z"/>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
        <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.1c.66 0 1.3.26 1.77.73l1.06 1.06c.19.19.45.3.71.3H18a2.5 2.5 0 0 1 2.5 2.5v7.9A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5V7.5z"/>
    </symbol>
    <symbol id="icon-folder-lock" viewBox="0 0 24 24">
        <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.1c.66 0 1.3.26 1.77.73l1.06 1.06c.19.19.45.3.71.3H18a2.5 2.5 0 0 1 2.5 2.5v7.9A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5V7.5z"/>
        <path d="M8.5 13.5v-1a2 2 0 0 1 4 0v1"/>
        <rect x="7.5" y="13.5" width="6" height="4.5" rx="1"/>
    </symbol>
    <symbol id="icon-folder-plus" viewBox="0 0 24 24">
        <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.1c.66 0 1.3.26 1.77.73l1.06 1.06c.19.19.45.3.71.3H18a2.5 2.5 0 0 1 2.5 2.5v7.9A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5V7.5z"/>
        <path d="M12 11.5v4M10 13.5h4"/>
    </symbol>
    <symbol id="icon-note" viewBox="0 0 24 24">
        <path d="M7 3.5h6.3L18 8.2v12.3H7z"/>
        <path d="M13.3 3.5v4.7H18M9.5 12h6M9.5 15h6M9.5 18h4"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M7 3.5h6.3L18 8.2v12.3H7z"/>
        <path d="M13.3 3.5v4.7H18"/>
    </symbol>
    <symbol id="icon-image" viewBox="0 0 24 24">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/>
        <circle cx="9" cy="10" r="1.5"/>
        <path d="m4.5 17.5 4.8-4.8 3.7 3.7 2.5-2.5 4 4"/>
    </symbol>
    <symbol id="icon-video" viewBox="0 0 24 24">
        <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/>
        <path d="m10 9.3 4.6 2.7-4.6 2.7z"/>
    </symbol>
    <symbol id="icon-audio" viewBox="0 0 24 24">
        <path d="M9 18.5V6.8l9-2v11.9"/>
        <circle cx="6.5" cy="18.5" r="2.5"/>
        <circle cx="15.5" cy="16.7" r="2.5"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
        <rect x="5.5" y="10" width="13" height="10" rx="2.5"/>
        <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
        <path d="M12 16V4m0 0 4 4m-4-4L8 8M5 20h14"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 4v12m0 0 4-4m-4 4-4-4M5 20h14"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5"/>
        <path d="m16 16 4 4"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="8.5" y="8.5" width="11" height="11" rx="2"/>
        <path d="M15.5 8.5v-2A2.5 2.5 0 0 0 13 4H6.5A2.5 2.5 0 0 0 4 6.5V13a2.5 2.5 0 0 0 2.5 2.5h2"/>
    </symbol>
    <symbol id="icon-cut" viewBox="0 0 24 24">
        <circle cx="6.5" cy="17.5" r="2.5"/>
        <circle cx="17.5" cy="17.5" r="2.5"/>
        <path d="M8.4 15.6 18 4M15.6 15.6 6 4"/>
    </symbol>
    <symbol id="icon-paste" viewBox="0 0 24 24">
        <path d="M9 5.5H7.5A2.5 2.5 0 0 0 5 8v10.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8a2.5 2.5 0 0 0-2.5-2.5H15"/>
        <rect x="9" y="3.5" width="6" height="4" rx="1"/>
        <path d="M9 11h6M9 14.5h6M9 18h3.5"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M10 11v6M14 11v6M8 7l.7 12.2A2 2 0 0 0 10.7 21h2.6a2 2 0 0 0 2-1.8L16 7M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="m14.5 5.5 4 4M5 19l4.5-1 9-9a2.1 2.1 0 0 0-3-3l-9 9z"/>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M5 4.5h11l3.5 3.5v11.5H5z"/>
        <path d="M8 4.5v5h7v-5M8 19.5v-5h8v5"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
        <path d="m14.5 6-6 6 6 6"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/>
    </symbol>
</svg>

<aside class="sidebar">
    <header class="brand">
        <div class="brand-mark">
            <svg class="icon"><use href="#icon-drive"></use></svg>
        </div>
        <div class="brand-copy">
            <h1>Drive</h1>
            <p id="storage-info">Loading storage</p>
        </div>
    </header>

    <div class="action-row">
        <button class="btn filled new-note" id="btn-new-note" type="button">
            <svg class="icon"><use href="#icon-plus"></use></svg>
            <span>New note</span>
        </button>
        <button class="btn tonal icon-only" id="btn-new-folder" type="button" aria-label="New folder" title="New folder">
            <svg class="icon"><use href="#icon-folder-plus"></use></svg>
        </button>
        <button class="btn tonal icon-only" id="btn-upload" type="button" aria-label="Upload files" title="Upload files">
            <svg class="icon"><use href="#icon-upload"></use></svg>
        </button>
        <input type="file" id="file-input" multiple hidden>
    </div>

    <div class="action-row compact">
        <button class="btn icon-only" id="btn-copy" type="button" aria-label="Copy" title="Copy" disabled>
            <svg class="icon"><use href="#icon-copy"></use></svg>
        </button>
        <button class="btn icon-only" id="btn-cut" type="button" aria-label="Cut" title="Cut" disabled>
            <svg class="icon"><use href="#icon-cut"></use></svg>
        </button>
        <button class="btn icon-only" id="btn-paste" type="button" aria-label="Paste" title="Paste" disabled>
            <svg class="icon"><use href="#icon-paste"></use></svg>
        </button>
        <span class="row-spacer"></span>
        <button class="btn icon-only" id="btn-refresh" type="button" aria-label="Refresh" title="Refresh">
            <svg class="icon"><use href="#icon-refresh"></use></svg>
        </button>
    </div>

    <div class="search-field">
        <svg class="icon"><use href="#icon-search"></use></svg>
        <input id="search-input" type="search" placeholder="Search files" autocomplete="off" spellcheck="false">
    </div>

    <div class="list-tools">
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Current path"></nav>
        <select id="sort-select" class="sort-select" aria-label="Sort files">
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
        </select>
    </div>

    <div class="dropzone" id="dropzone" role="button" tabindex="0">
        <svg class="icon"><use href="#icon-upload"></use></svg>
        <span>Drop files to upload</span>
    </div>

    <ul class="file-list" id="file-list"></ul>
</aside>

<main class="main" id="main">
    <header class="topbar">
        <button class="btn icon-only back-btn" id="btn-back" type="button" aria-label="Back to files">
            <svg class="icon"><use href="#icon-back"></use></svg>
        </button>
        <div class="file-heading">
            <span class="eyebrow" id="file-kind">Preview</span>
            <h2 id="current-filename">Select a file</h2>
        </div>
        <div class="topbar-actions" id="actions"></div>
    </header>
    <section class="content" id="content-area"></section>
</main>

<dialog class="modal" id="modal">
    <form class="modal-form" id="modal-form" method="dialog">
        <h3 id="modal-title"></h3>
        <p id="modal-message"></p>
        <label class="field" id="modal-field-wrap">
            <span id="modal-label"></span>
            <input id="modal-input" type="text" autocomplete="off">
        </label>
        <div class="modal-actions">
            <button class="btn" id="modal-cancel" type="button">Cancel</button>
            <button class="btn filled" id="modal-confirm" type="submit">OK</button>
        </div>
    </form>
</dialog>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
